<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css">
    <title>Form register</title>
</head>

<body>
    <div id="wrapper">
        <form action="" id="form-login">
            <h1 class="form-heading">Đăng ký</h1>
            <div class="form-group">
                <i class="far fa-user"></i>
                <input type="text" class="form-input" placeholder="Họ và tên">
            </div>

            <div class="form-group">
                <i class="fas fa-key"></i>
                <input type="text" id="birthday" name="birthday" class="form-input" placeholder="Ngày sinh (dd/mm/yyyy)">
            </div>

            <div class="form-group">
                <i class="far fa-user"></i>
                <input type="tel" id="telephone" name="phone" class="form-input" placeholder="Nhập số điện thoại" pattern="[0-9]{10}" title="Số điện thoại phải gồm 10 chữ số">

            </div>

            <div class="form-group">
                <i class="far fa-user"></i>
                <input type="text" class="form-input" placeholder="Tên đăng nhập">
            </div>

            <div class="form-group">
                <i class="far fa-user"></i>
                <input type="text" class="form-input" placeholder="Mật khẩu">
            </div>

            <input type="submit" value="Đăng ký" class="form-submit">
            <div class="form-bottom">
                <h2 style="display: inline;">Đã có tài khoản?</h2>
                <a href="/form-login/index.html" style="display: inline;">Đăng nhập</a>
            </div>
        </form>
    </div>
    
</body>
<script src="https://code.jquery.com/jquery-3.6.0.js"></script>
<script src="js/app.js"></script>

<!-- Js của ngày sinh -->
<script>
    document.getElementById("birthday").onfocus = function() {
        this.type = 'date';
    }
    document.getElementById("birthday").onblur = function() {
        if (this.value === "") {
            this.type = 'text';
            this.placeholder = 'Ngày sinh (dd/mm/yyyy)';
        }
    }
</script>
<!--  -->
</html>
